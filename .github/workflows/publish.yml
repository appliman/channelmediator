name: Publish to NuGet

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_FILE: ChannelMediator.slnx

jobs:
  publish:
    name: Pack & Publish to NuGet
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build Release
        run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration Release

      - name: Pack ChannelMediator.Contracts
        run: >
          dotnet pack src/ChannelMediator.Contracts/ChannelMediator.Contracts.csproj
          --no-build
          --configuration Release
          --output ./nupkgs

      - name: Pack ChannelMediator
        run: >
          dotnet pack src/ChannelMediator/ChannelMediator.csproj
          --no-build
          --configuration Release
          --output ./nupkgs

      - name: Pack ChannelMediator.AzureBus
        run: >
          dotnet pack src/ChannelMediator.AzureBus/ChannelMediator.AzureBus.csproj
          --no-build
          --configuration Release
          --output ./nupkgs

      - name: Pack ChannelMediator.RabbitMQ
        run: >
          dotnet pack src/ChannelMediator.RabbitMQ/ChannelMediator.RabbitMQ.csproj
          --no-build
          --configuration Release
          --output ./nupkgs

      - name: Pack ChannelMediator.InMemory
        run: >
          dotnet pack src/ChannelMediator.InMemory/ChannelMediator.InMemory.csproj
          --no-build
          --configuration Release
          --output ./nupkgs

      - name: Pack ChannelMediator.ApiGenerators.Abstraction
        run: >
          dotnet pack src/ChannelMediator.ApiGenerators.Abstraction/ChannelMediator.ApiGenerators.Abstraction.csproj
          --no-build
          --configuration Release
          --output ./nupkgs

      - name: Pack ChannelMediator.MinimalApiGenerator
        run: >
          dotnet pack src/ChannelMediator.MinimalApiGenerator/ChannelMediator.MinimalApiGenerator.csproj
          --no-build
          --configuration Release
          --output ./nupkgs

      - name: Pack ChannelMediator.ApiClientGenerator
        run: >
          dotnet pack src/ChannelMediator.ApiClientGenerator/ChannelMediator.ApiClientGenerator.csproj
          --no-build
          --configuration Release
          --output ./nupkgs

      - name: Pack ChannelMediator.GrpcGenerator
        run: >
          dotnet pack src/ChannelMediator.GrpcGenerator/ChannelMediator.GrpcGenerator.csproj
          --no-build
          --configuration Release
          --output ./nupkgs

      - name: Pack ChannelMediator.GrpcClientGenerator
        run: >
          dotnet pack src/ChannelMediator.GrpcClientGenerator/ChannelMediator.GrpcClientGenerator.csproj
          --no-build
          --configuration Release
          --output ./nupkgs

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ./nupkgs/*.nupkg
          retention-days: 14

      - name: Sign in to NuGet.org with OIDC
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: appliman

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push ./nupkgs/*.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
